resources:
  pipelines:
    # The full spec, declaratively (Lakeflow Spark Declarative Pipelines, ADR-0013). Triggered by
    # the daily job in two refreshes (silver and gate, then gold), never continuous.
    olist_sdp:
      name: olist_sdp
      catalog: workspace
      schema: olist_sdp
      serverless: true
      continuous: false
      channel: CURRENT
      # The event log as a table: expectation counts and how each materialized view was refreshed,
      # readable by the dashboard without owning the pipeline.
      event_log:
        catalog: workspace
        schema: olist_sdp
        name: event_log
      libraries:
        - file:
            path: ../lakeflow/olist_sdp.sql
        - file:
            path: ../lakeflow/sellers_scd2.py
      configuration:
        olist.landing: /Volumes/workspace/olist_raw/files/landing
        olist.backfill_date: "2018-05-31"
        olist.late_tolerance_days: "3"
        olist.dq_max_bad_ratio: "0.05"
        # A failed update is not retried by the pipeline: a failed gate fails again on retry, and the
        # job retries the steps where a retry helps (ADR-0013).
        pipelines.numUpdateRetryAttempts: "0"
