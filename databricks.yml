# Databricks Asset Bundle: builds the wheel, deploys the two jobs (serverless) and the dashboard.
bundle:
  name: olist_lakehouse_pipeline

include:
  - resources/*.yml

variables:
  warehouse_id:
    description: SQL warehouse that runs the dashboard queries
    lookup:
      warehouse: "Serverless Starter Warehouse"

artifacts:
  default:
    type: whl
    # Start from an empty dist/: the jobs install ../dist/*.whl, so a wheel left over from an
    # older version would be installed alongside the new one.
    build: python3 -c "import shutil; shutil.rmtree('dist', ignore_errors=True)" && uv build --wheel
    path: .

targets:
  dev:
    # Prefixes job names with [dev <user>] and pauses schedules.
    mode: development
    default: true
